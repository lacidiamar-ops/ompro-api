name: V16 planning push hotfix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip v16 patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old="        employee_id:r.employee_id,\n          work_date:r.work_date,"
          new="        employee_id:r.employee_id,\n          mission_order:Number(r.mission_order||1),\n          work_date:r.work_date,"
          if old in text and 'mission_order:Number(r.mission_order||1)' not in text:
              text=text.replace(old,new,1)
          export_fn=base64.b64decode('').decode()
          start=text.find('window.exportPlanningXLSX = function(){')
          if start!=-1:
              end=text.find('\n  // Compatibilité ancienne barre',start)
              if end!=-1: text=text[:start]+export_fn+text[end:]
          marker='/* V16_AUTO_PUSH_PLANNING */'
          if marker not in text:
              push=base64.b64decode('').decode()
              text=text.replace('</body>',push+'\n</body>',1)
          text=text.replace('Version V12.5 · OM PRO × API','Version V16.0 · OM PRO × API')
          p.write_text(text,encoding='utf-8')
          sw=Path('service-worker.js')
          if sw.exists():
              s=sw.read_text(encoding='utf-8')
              s=re.sub(r"const CACHE = '[^']+';","const CACHE = 'om-pro-api-v160-planning-push';",s,count=1)
              sw.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "V16 planning save, automatic push reminders and weekly export [skip v16 patch]"
          git push origin HEAD:main
