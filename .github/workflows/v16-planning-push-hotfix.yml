name: V16.1 planning persistence fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip v161 patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V16.1 client patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="planning-v161-fix.js"></script>'
          if tag not in text:
              pos=text.rfind('</body>')
              if pos < 0: raise RuntimeError('closing body not found')
              text=text[:pos]+tag+'\n'+text[pos:]
          text=text.replace('Version V16.0 · OM PRO × API','Version V16.1 · OM PRO × API')
          p.write_text(text,encoding='utf-8')
          sw=Path('service-worker.js')
          if sw.exists():
              s=sw.read_text(encoding='utf-8')
              import re
              s=re.sub(r"const CACHE_NAME = '[^']+';", "const CACHE_NAME = 'ompro-v161-planning-fix';", s, count=1)
              sw.write_text(s,encoding='utf-8')
          PY
      - name: Commit V16.1 client
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Activate V16.1 planning save and employee display fix [skip v161 patch]"
          git push origin HEAD:main
