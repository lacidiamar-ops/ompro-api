name: V16 planning push hotfix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip v16 patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize V16 client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace("!window.state?.current?.id || !window.sb", "!state?.current?.id || !sb")
          p.write_text(text,encoding='utf-8')
          sw=Path('service-worker.js')
          if sw.exists():
              s=sw.read_text(encoding='utf-8')
              s=s.replace("const CACHE_NAME = 'ompro-v200-fresh';", "const CACHE_NAME = 'ompro-v160-planning-push';")
              sw.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Finalize V16 automatic planning notifications [skip v16 patch]"
          git push origin HEAD:main
