name: V16 planning push hotfix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip v16 patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and install V16 client push
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='/* V16_AUTO_PUSH_PLANNING */'
          idx=text.find(marker)
          if idx!=-1:
              bad_start=text.rfind('\n<script>\n',0,idx)
              bad_end=text.find('\n</script>\n\n</body></html>`);',idx)
              if bad_start!=-1 and bad_end!=-1:
                  close_end=bad_end+len('\n</script>')
                  text=text[:bad_start]+text[close_end:]
          push=base64.b64decode('').decode()
          if marker not in text:
              pos=text.rfind('</body>')
              if pos==-1: raise RuntimeError('closing body not found')
              text=text[:pos]+push+'\n'+text[pos:]
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit repaired app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair V16 push placement and keep app script valid [skip v16 patch]"
          git push origin HEAD:main
